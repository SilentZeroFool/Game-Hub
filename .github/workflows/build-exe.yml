name: Build Windows Executables (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean npm artifacts (workaround for npm optional deps bug)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Removing node_modules and package-lock.json (workaround for npm optional deps bug)..."
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }

      - name: Install dependencies
        run: npm install

      - name: Ensure rollup native binary (optional)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            npm install --no-save @rollup/rollup-win32-x64-msvc
          } catch {
            Write-Host "Optional rollup binary install failed or not available; continuing..."
          }

      - name: Build web application
        run: npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Tauri and Build
        shell: pwsh
        run: |
          # remove previous src-tauri directory if present
          Remove-Item -Recurse -Force src-tauri -ErrorAction SilentlyContinue

          # initialize tauri (use single-quoted CLI args to avoid nested quote problems)
          npx tauri init --app-name 'GameHub' --window-title 'Game Hub' --frontend-dist '../dist' --dev-url 'http://localhost:3000' --before-build-command 'npm run build' --before-dev-command 'npm run dev'

          # add plugins
          npx tauri add dialog
          npx tauri add shell

          # edit tauri.conf.json reliably using node (AFTER plugins are added)
          node -e 'const fs = require("fs"); const f = "src-tauri/tauri.conf.json"; let c = fs.readFileSync(f, "utf8"); c = c.replace(/com\.tauri\.dev/g, "com.gamehub.app"); let conf = JSON.parse(c); conf.plugins = conf.plugins || {}; conf.plugins.shell = conf.plugins.shell || {}; conf.plugins.shell.open = true; fs.writeFileSync(f, JSON.stringify(conf, null, 2));'
          
          # allow shell open for all files
          node -e 'const fs = require("fs"); const f = "src-tauri/capabilities/default.json"; if (fs.existsSync(f)) { let cap = JSON.parse(fs.readFileSync(f, "utf8")); cap.permissions.push({ identifier: "shell:allow-open", allow: [{ path: "**" }] }); fs.writeFileSync(f, JSON.stringify(cap, null, 2)); }'

          # write custom lib.rs with run_game command
          $libRsContent = @(
            '#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]',
            'use std::process::Command;',
            'use std::path::Path;',
            '',
            '#[tauri::command]',
            'fn run_game(path: String) -> Result<(), String> {',
            '  let p = Path::new(&path);',
            '  if !p.exists() {',
            '    return Err(format!("Exe not found: {}", path));',
            '  }',
            '  let dir = p.parent().unwrap_or_else(|| Path::new("."));',
            '  match Command::new(&path).current_dir(dir).spawn() {',
            '    Ok(_) => Ok(()),',
            '    Err(e) => Err(format!("Failed to spawn ''{}'': {}", path, e))',
            '  }',
            '}',
            '',
            '#[cfg_attr(mobile, tauri::mobile_entry_point)]',
            'pub fn run() {',
            '  tauri::Builder::default()',
            '    .plugin(tauri_plugin_shell::init())',
            '    .plugin(tauri_plugin_dialog::init())',
            '    .invoke_handler(tauri::generate_handler![run_game])',
            '    .setup(|app| {',
            '      Ok(())',
            '    })',
            '    .run(tauri::generate_context!())',
            '    .expect("error while running tauri application");',
            '}'
          )
          Set-Content -Path src-tauri/src/lib.rs -Value $libRsContent -Encoding UTF8

          # build the Tauri app
          npx tauri build

      - name: Upload Tauri Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-Tauri-Exe
          path: |
            src-tauri/target/release/bundle/*/*
            src-tauri/target/release/*.exe
